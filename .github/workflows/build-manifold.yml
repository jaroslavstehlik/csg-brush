# Builds the Manifold native library for the editor platforms. Each platform's library is uploaded as an artifact of
# the run; download them and place them under Manifold/Plugins (see CONTRIBUTING.md).
# Run it from the Actions tab (workflow_dispatch) after changing Manifold/native or bumping MANIFOLD_TAG.
name: Build Manifold plugin

on:
  workflow_dispatch:
  push:
    paths:
      - "Manifold/native/**"
      - ".github/workflows/build-manifold.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple silicon runner
            artifact: macOS/libmanifoldc.dylib
            built: build/libmanifoldc.dylib
          - os: windows-2022
            artifact: Windows/x86_64/manifoldc.dll
            built: build/Release/manifoldc.dll
          - os: ubuntu-22.04
            artifact: Linux/x86_64/libmanifoldc.so
            built: build/libmanifoldc.so
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S Manifold/native -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Collect
        shell: bash
        run: |
          mkdir -p out/$(dirname "${{ matrix.artifact }}")
          cp "${{ matrix.built }}" "out/${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.os }}
          path: out
